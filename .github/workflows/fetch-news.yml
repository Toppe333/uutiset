name: Hae ja julkaise uutiset

# news.json ei tallennu repoon: se rakennetaan joka ajolla ja julkaistaan suoraan
# GitHub Pagesiin. Edellinen tila luetaan julkaistulta sivulta, ja yli 48 tuntia
# vanhat jutut poistuvat jokaisella ajolla.

on:
  schedule:
    - cron: "*/20 * * * *"   # 20 min välein (GitHub voi viivästyttää ajoja ruuhkassa)
    - cron: "7 3 * * *"      # kerran päivässä myös keepalive-työ (ks. alla)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v6

      - name: Hae syötteet
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/news.json
        run: python scripts/fetch_news.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub sammuttaa ajastetut työnkulut, jos repoon ei tule committeja 60 päivään.
  # Työnkulun uudelleen käyttöön ottaminen API:lla nollaa laskurin ilman committeja.
  keepalive:
    if: github.event.schedule == '7 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Pidä ajastus käytössä
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fetch-news.yml/enable"

name: Hae ja julkaise uutiset

# news.json ei tallennu repoon: se rakennetaan joka ajolla ja julkaistaan suoraan
# GitHub Pagesiin. Edellinen tila luetaan julkaistulta sivulta, ja yli 48 tuntia
# vanhat jutut poistuvat jokaisella ajolla.
#
# Ajastettu haku tehdään vain klo 6–23 Helsingin aikaa. GitHubin cron toimii UTC-ajassa
# eikä tunne kesäaikaa, joten cron kattaa molemmat (UTC 3–21) ja gate-työ tarkistaa
# Helsingin kellonajan. Käsin käynnistetty haku (Päivitä-painike) ja push ajetaan aina.

on:
  schedule:
    # 20 min välein, ei tasaminuuteilla (GitHub viivästyttää ja jättää ruuhka-aikojen ajoja väliin)
    - cron: "7,27,47 3-21 * * *"
    - cron: "7 3 * * *"      # kerran päivässä myös keepalive-työ (ks. alla)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          hour=$(TZ=Europe/Helsinki date +%-H)
          if [ "$EVENT" != "schedule" ]; then
            run=true
          elif [ "$SCHEDULE" = "7,27,47 3-21 * * *" ] && [ "$hour" -ge 6 ]; then
            run=true
          else
            run=false
          fi
          echo "Helsingin tunti $hour, tapahtuma $EVENT, haetaan: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v6

      - name: Hae syötteet
        env:
          PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}/news.json
        run: python scripts/fetch_news.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub sammuttaa ajastetut työnkulut, jos repoon ei tule committeja 60 päivään.
  # Työnkulun uudelleen käyttöön ottaminen API:lla nollaa laskurin ilman committeja.
  keepalive:
    if: github.event.schedule == '7 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Pidä ajastus käytössä
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fetch-news.yml/enable"

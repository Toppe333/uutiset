<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Uutiset</title>
  <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131415" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Uutiset">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <!-- Julkaisijoiden omat fontit ovat lisensoituja, joten käytössä on lähimmät avoimet vastineet. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Hanken+Grotesk:wght@400;600&family=Inter:wght@400;600&family=Literata:opsz,wght@7..72,700&family=Newsreader:opsz,wght@6..72,700&family=Open+Sans:wght@400;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,700&family=Zilla+Slab:wght@700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="bar">
      <h1>Uutiset</h1>
      <button id="refresh" class="refresh" type="button" aria-label="Päivitä">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
    <div class="pickers">
      <button id="sourceBtn" class="picker-btn" type="button" aria-expanded="false" aria-controls="sourcePanel">
        <span class="txt"><span class="lbl">Lähde</span><span class="val" id="sourceVal">Kaikki</span></span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
      </button>
      <button id="topicBtn" class="picker-btn" type="button" aria-expanded="false" aria-controls="topicPanel">
        <span class="txt"><span class="lbl">Aiheet</span><span class="val" id="topicVal">Kaikki</span></span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div id="sourcePanel" class="panel" hidden></div>
    <div id="topicPanel" class="panel" hidden></div>
    <p id="status" class="status" aria-live="polite"></p>
  </header>
  <main id="list" class="list"></main>
  <section id="reader" class="reader" hidden aria-label="Juttu"></section>
  <script src="app.js"></script>
</body>
</html>
